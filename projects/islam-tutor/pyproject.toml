[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "islam-tutor"
version = "0.1.0"
description = "Interaktive Lernplattform fuer islamisches Wissen und Arabisch — Lernhilfe, kein Urteilssystem"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Phase 1/2/3 Kern: laeuft ohne externe LLM- oder Embedding-Anbieter.
# Der lexikalische Retriever funktioniert offline; semantische Suche ist ein
# optionales Upgrade, kein Startbedarf.
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "jsonschema>=4.22",
]
llm = [
    "anthropic>=0.30",
]
voice = [
    "openai-whisper>=20231117",
]

[project.scripts]
islam-tutor-verify = "scripts.verify_knowledge:main"

[tool.setuptools]
packages = ["ai", "backend", "voice"]

[tool.setuptools.package-dir]
ai = "ai"
backend = "backend"
voice = "voice"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "policy: Test einer Regel aus docs/CONTENT_POLICY.md — darf nie uebersprungen werden",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
