  <text x="480" y="498" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#94a3b8">DISCOVER → ANALYZE → VALIDATE → DECIDE → BUILD → DEPLOY → MARKET → MEASURE → IMPROVE</text>
